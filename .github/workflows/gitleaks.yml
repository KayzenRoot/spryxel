name: Gitleaks secrets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/spryxel-wo-001-gef-github-governance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Gitleaks secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head and Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Gitleaks CLI and verify release checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          "$install_dir/gitleaks" version
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan the complete PR commit range with redacted output
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          valid_sha() { [[ "$1" =~ ^[0-9a-f]{40}$ ]]; }
          zero_sha="0000000000000000000000000000000000000000"
          case "$EVENT_NAME" in
            pull_request)
              valid_sha "$PR_BASE_SHA" && valid_sha "$PR_HEAD_SHA" || { echo "::error::Invalid PR base or head SHA"; exit 1; }
              test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA" || { echo "::error::Checkout does not match PR head"; exit 1; }
              git fetch --no-tags origin "$PR_BASE_SHA"
              merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
              log_opts="$merge_base..$PR_HEAD_SHA --diff-merges=separate"
              ;;
            push)
              valid_sha "$EVENT_SHA" && valid_sha "$PUSH_BEFORE_SHA" || { echo "::error::Invalid push event SHA"; exit 1; }
              test "$(git rev-parse HEAD)" = "$EVENT_SHA" || { echo "::error::Checkout does not match event SHA"; exit 1; }
              if [ "$EVENT_REF" = "refs/heads/codex/spryxel-wo-001-gef-github-governance" ]; then
                git fetch --no-tags origin main
                merge_base="$(git merge-base origin/main "$EVENT_SHA")"
                log_opts="$merge_base..$EVENT_SHA --diff-merges=separate"
              elif [ "$PUSH_BEFORE_SHA" = "$zero_sha" ]; then
                log_opts="--all --diff-merges=separate"
              else
                git cat-file -e "$PUSH_BEFORE_SHA^{commit}" || { echo "::error::Prior push commit unavailable"; exit 1; }
                log_opts="$PUSH_BEFORE_SHA..$EVENT_SHA --diff-merges=separate"
              fi
              ;;
            schedule|workflow_dispatch)
              log_opts="--all --diff-merges=separate"
              ;;
            *)
              echo "::error::Unsupported security scan event"
              exit 1
              ;;
          esac
          gitleaks git --redact=100 --no-color --no-banner --ignore-gitleaks-allow \
            --exit-code=1 --log-opts="$log_opts" .
