name: Pipeline integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/spryxel-wo-001-gef-github-governance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Pipeline integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce immutable Actions and least privilege
        run: ruby .github/scripts/pipeline-integrity.rb
