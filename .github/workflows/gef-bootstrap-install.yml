name: GEF Bootstrap 1.1.1 Install

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile before GEF mutation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock GEF Bootstrap 1.1.1"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Install exact GEF package
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify CLI identity
        shell: bash
        run: |
          npx --no-install gef --version --json >/tmp/gef-version.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/gef-version.json","utf8")); if(x.ok!==true || x.name!=="gef" || x.version!=="1.1.1") { console.error(x); process.exit(1); }'
          npx --no-install gef --help --json >/tmp/gef-help.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/gef-help.json","utf8")); if(x.ok!==true) { console.error(x); process.exit(1); }'

      - name: Preview new-project initialization
        run: npx --no-install gef init --target "$GITHUB_WORKSPACE" --json >/tmp/gef-init-preview.json

      - name: Apply governed initialization
        run: npx --no-install gef init --apply --target "$GITHUB_WORKSPACE" --json >/tmp/gef-init-apply.json

      - name: Validate doctor
        run: npx --no-install gef doctor --target "$GITHUB_WORKSPACE" --json >/tmp/gef-doctor.json

      - name: Validate repeated status
        shell: bash
        run: |
          npx --no-install gef status --target "$GITHUB_WORKSPACE" --json >/tmp/gef-status-1.json
          npx --no-install gef status --target "$GITHUB_WORKSPACE" --json >/tmp/gef-status-2.json
          cmp /tmp/gef-status-1.json /tmp/gef-status-2.json

      - name: Commit governed GEF state
        shell: bash
        run: |
          git add .gef
          if ! git diff --cached --quiet; then
            git commit -m "chore: initialize GEF Bootstrap 1.1.1"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Final verification
        shell: bash
        run: |
          npx --no-install gef doctor --target "$GITHUB_WORKSPACE" --json
          npx --no-install gef status --target "$GITHUB_WORKSPACE" --json
