name: Temporary Next.js security lockfile regeneration (Issue 111)

on:
  push:
    branches: [security/nextjs-16-4-1-issue-111]
    paths:
      - 'apps/web/package.json'
      - '.github/workflows/security-next-lock-once.yml'

permissions: {}

concurrency:
  group: security-next-lock-once
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.repository == 'KayzenRoot/spryxel' && github.actor == 'KayzenRoot'
    name: Temporary lockfile repair for security branch only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact authorized source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Use pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Strict branch, identity and package manager gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/security/nextjs-16-4-1-issue-111"
          test "$GITHUB_REPOSITORY" = 'KayzenRoot/spryxel'
          test "$GITHUB_ACTOR" = 'KayzenRoot'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(npm --version)" = "10.9.9"
          node -e "const p=require('./apps/web/package.json'); if(p.dependencies.next!=='16.4.1')process.exit(1)"
          test -z "$(git status --porcelain)"
      - name: Generate real npm v10 lockfile with scripts disabled
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if (lock.packages['apps/web'].dependencies.next !== '16.4.1') throw Error('Workspace next mismatch');
          if (lock.packages['node_modules/next']?.version !== '16.4.1') throw Error('Resolved next mismatch');
          if (lock.packages['node_modules/@next/env']?.version !== '16.4.1') throw Error('Resolved next env mismatch');
          const swcs = Object.entries(lock.packages).filter(([p]) => p.startsWith('node_modules/@next/swc-'));
          if (!swcs.length || swcs.some(([p,v])=>v.version !== '16.4.1')) throw Error('SWC version mismatch');
          console.log('LOCK_VALID next=16.4.1 env=16.4.1 swc='+swcs.length);
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          git add -- package-lock.json
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git diff --cached --check
      - name: Commit only generated package-lock.json to same security branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): regenerate Next.js 16.4.1 npm lockfile"
          git push origin "HEAD:refs/heads/security/nextjs-16-4-1-issue-111"
